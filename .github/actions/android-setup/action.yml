name: Android build setup
description: The JDK, Gradle, Go, Android NDK and native Wharf library that every Appfredo build needs.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v6
    - uses: actions/setup-go@v7
      with:
        go-version-file: native/wharf/go.mod
        cache: false
    - name: Android NDK and build tools
      shell: bash
      run: |
        # The runner image already ships both, and Gradle fetches the SDK platform itself. sdkmanager is not on
        # PATH there, so it is called by its full path, and only if the image ever stops shipping them.
        for package in 'ndk;29.0.14206865' 'build-tools;36.0.0'; do
          [ -d "$ANDROID_HOME/${package/;//}" ] || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$package"
        done
    - name: Build Wharf for Android
      shell: bash
      run: |
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
        bash scripts/build-wharf.sh
