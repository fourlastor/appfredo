name: Build Appfredo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/wharf/go.mod
          cache: false
      - name: Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - name: Build Wharf for Android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash scripts/build-wharf.sh
      - name: Test native patch verification
        run: |
          export GOPATH="$PWD/.tools/gopath" GOCACHE="$PWD/.tools/go-cache"
          go -C native/wharf test ./...
      - name: Build and check Android app
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: appfredo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
